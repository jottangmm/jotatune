name: Compilar JotaTune
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Compilar
        run: cmake --build build --config Release
      - name: Guardar VST3
        uses: actions/upload-artifact@v4
        with:
          name: JotaTune-VST3
          path: build/JotaTune_artefacts/Release/VST3/JotaTune.vst3
